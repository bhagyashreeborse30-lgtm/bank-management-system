<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — NexaBank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
<div class="auth-wrap fade-in">
  <div class="auth-box">
    <div class="auth-header">
      <div class="auth-logo-wrap">N</div>
      <h1 class="auth-title">NexaBank</h1>
      <p class="auth-sub">Sign in to your account</p>
    </div>
    <div class="card auth-card">
      {% if error %}
      <div class="alert alert-error">{{ error }}</div>
      {% endif %}
      <form method="post">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" name="email" class="form-input" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-input" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary btn-full" style="margin-top:0.5rem">Sign In →</button>
      </form>
      <p class="auth-footer">No account? <a href="/register">Create one</a></p>
    </div>
  </div>
</div>
</body>
</html>
