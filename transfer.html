{% extends "base.html" %}
{% block title %}Transfer — NexaBank{% endblock %}
{% block content %}

<h1 class="page-title">Transfer Funds</h1>
<div class="card page-card">
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  {% if success %}<div class="alert alert-success">{{ success }}</div>{% endif %}
  <form method="post">
    <div class="form-group">
      <label class="form-label">From Account</label>
      <select name="from_account_id" class="form-select">
        {% for a in accounts %}
        <option value="{{ a.id }}">{{ a.account_type|upper }} — {{ a.account_number }} (₹{{ "{:,.2f}".format(a.balance) }})</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">To Account Number</label>
      <input type="text" name="to_account_number" class="form-input" placeholder="e.g. ACC1234567890" required />
    </div>
    <div class="form-group">
      <label class="form-label">Amount (₹)</label>
      <input type="number" name="amount" class="form-input" placeholder="0.00" min="1" step="0.01" required />
    </div>
    <div class="form-group">
      <label class="form-label">Description (optional)</label>
      <input type="text" name="description" class="form-input" placeholder="e.g. Rent payment" />
    </div>
    <button type="submit" class="btn btn-primary btn-full">Transfer Funds</button>
  </form>
</div>
{% endblock %}
